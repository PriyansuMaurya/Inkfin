name: Build and publish release

# One tag (or one manual run) produces installable files on the Releases page:
#   Windows  -> Inkfin_<version>_x64-setup.exe   (NSIS, includes WebView2 bootstrapper)
#   macOS    -> Inkfin_<version>_universal.dmg   (Apple silicon + Intel)
#
# The macOS name says what the artifact really is, decided by which secrets
# exist and never assumed:
#   certificate + Apple ID/API key -> Inkfin_<version>_universal.dmg
#   certificate only               -> Inkfin_<version>_universal-signed-unnotarized.dmg
#   no certificate                 -> Inkfin_<version>_universal-unsigned.dmg
# The last two are installable test builds, not notarised public releases.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (defaults to v<version from tauri.conf.json>)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Resolves the one tag this run publishes and what the macOS job is allowed
  # to claim, so the build steps, asset names and release body cannot disagree.
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      sha: ${{ steps.resolve.outputs.sha }}
      signed: ${{ steps.resolve.outputs.signed }}
      notarized: ${{ steps.resolve.outputs.notarized }}
      distribution: ${{ steps.resolve.outputs.distribution }}
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      REQUESTED_TAG: ${{ inputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag, version and distribution label
        id: resolve
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")

          TAG="${REQUESTED_TAG:-}"
          if [ -z "$TAG" ]; then
            if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
              TAG="${GITHUB_REF_NAME}"
            else
              TAG="v${VERSION}"
            fi
          fi
          # Accept "0.1.2" as well as "v0.1.2" from a manual run.
          case "$TAG" in
            v*) ;;
            *) TAG="v${TAG}" ;;
          esac

          if [ "$TAG" != "v${VERSION}" ]; then
            echo "::error::Tag $TAG does not match the app version ${VERSION} in src-tauri/tauri.conf.json. Bump the version, or build the matching tag."
            exit 1
          fi

          # A manual run from a branch must not replace the assets of an older
          # tag with binaries built from newer code. Rebuild a release by
          # dispatching on the tag itself.
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            TAG_SHA=$(git rev-parse "refs/tags/${TAG}^{commit}")
            if [ "$TAG_SHA" != "$GITHUB_SHA" ]; then
              echo "::error::Tag $TAG points at $TAG_SHA, but this run built $GITHUB_SHA."
              echo "Run the workflow against the $TAG ref, or bump the version before publishing."
              exit 1
            fi
          fi

          SIGNED=false
          if [ -n "${APPLE_CERTIFICATE:-}" ]; then
            SIGNED=true
          fi

          NOTARIZED=false
          if [ "$SIGNED" = "true" ]; then
            if [ -n "${APPLE_API_KEY:-}" ] && [ -n "${APPLE_API_ISSUER:-}" ]; then
              NOTARIZED=true
            elif [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_PASSWORD:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ]; then
              NOTARIZED=true
            fi
          fi

          if [ "$NOTARIZED" = "true" ]; then
            DISTRIBUTION=release
          elif [ "$SIGNED" = "true" ]; then
            DISTRIBUTION=signed-unnotarized
          else
            DISTRIBUTION=unsigned
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "signed=$SIGNED" >> "$GITHUB_OUTPUT"
          echo "notarized=$NOTARIZED" >> "$GITHUB_OUTPUT"
          echo "distribution=$DISTRIBUTION" >> "$GITHUB_OUTPUT"

          {
            echo "### Release ${TAG}"
            echo ""
            echo "- Version: \`${VERSION}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- macOS artifact: \`${DISTRIBUTION}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  build-windows:
    needs: resolve
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          prefix-key: inkfin-v1

      - name: Install frontend dependencies
        run: npm ci

      - name: Build the NSIS installer
        run: npx tauri build

      - name: Verify the installer exists
        shell: bash
        run: |
          set -euo pipefail
          INSTALLER=$(find src-tauri/target/release/bundle/nsis -maxdepth 1 -name '*-setup.exe' -print -quit)
          if [ -z "$INSTALLER" ]; then
            echo "::error::no NSIS installer was produced under src-tauri/target/release/bundle/nsis"
            exit 1
          fi
          echo "Installer: $INSTALLER"
          ls -l "$INSTALLER"

      - name: Upload the installer as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: inkfin-windows
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14

  build-macos:
    needs: resolve
    runs-on: macos-15
    env:
      # Signing certificate (base64 .p12) and its export password.
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      # Password for the throwaway keychain created in this job.
      MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
      # Notarisation: either the Apple ID trio or the App Store Connect key pair.
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      # Contents of the AuthKey_<KEYID>.p8 file, if the API-key route is used.
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      SIGNED: ${{ needs.resolve.outputs.signed }}
      NOTARIZED: ${{ needs.resolve.outputs.notarized }}
      DISTRIBUTION: ${{ needs.resolve.outputs.distribution }}
      VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install both macOS Rust targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          prefix-key: inkfin-macos-v1
          key: universal

      - name: Install frontend dependencies
        run: npm ci

      - name: Import Developer ID certificate
        if: env.SIGNED == 'true'
        env:
          CERTIFICATE_PATH: ${{ runner.temp }}/inkfin-developer-id.p12
          KEYCHAIN_PATH: ${{ runner.temp }}/inkfin-signing.keychain-db
        run: |
          set -euo pipefail
          if [ -z "${MACOS_KEYCHAIN_PASSWORD:-}" ]; then
            echo "::error::APPLE_CERTIFICATE is set but MACOS_KEYCHAIN_PASSWORD is not."
            echo "Set the keychain password secret, or remove the certificate secrets to build an unsigned test bundle."
            exit 1
          fi
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          # Only this keychain is in the search list: codesign must find the
          # Developer ID identity there, and nothing else is needed by the build.
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$MACOS_KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          rm -f "$CERTIFICATE_PATH"

      # Tauri looks for AuthKey_<KEYID>.p8 on disk; the secret holds its text so
      # the key itself never appears in a command line or a log.
      - name: Write the App Store Connect API key
        if: env.APPLE_API_KEY != '' && env.APPLE_API_KEY_P8 != ''
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APPLE_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Build universal .app and .dmg
        run: |
          set -euo pipefail
          args=(--target universal-apple-darwin --ci)
          if [ "${SIGNED}" != "true" ]; then
            # Explicit rather than implied: an unsigned bundle is a test build.
            args+=(--no-sign)
          fi
          npx tauri build "${args[@]}"

      - name: Verify the bundle is universal and complete
        run: |
          set -euo pipefail
          APP="src-tauri/target/universal-apple-darwin/release/bundle/macos/Inkfin.app"
          DMG_DIR="src-tauri/target/universal-apple-darwin/release/bundle/dmg"

          test -d "$APP" || { echo "::error::$APP is missing"; exit 1; }
          test -x "$APP/Contents/MacOS/Inkfin" || { echo "::error::the app binary is missing"; exit 1; }

          ARCHS=$(lipo -archs "$APP/Contents/MacOS/Inkfin")
          echo "Architectures: $ARCHS"
          case "$ARCHS" in
            *arm64*x86_64*|*x86_64*arm64*) ;;
            *) echo "::error::expected a universal binary, got: $ARCHS"; exit 1 ;;
          esac

          DMG=$(find "$DMG_DIR" -maxdepth 1 -name '*.dmg' -print -quit)
          test -n "$DMG" || { echo "::error::no .dmg was produced"; exit 1; }
          echo "DMG: $DMG"

      - name: Verify signing, notarisation and the stapled ticket
        if: env.NOTARIZED == 'true'
        run: |
          set -euo pipefail
          APP="src-tauri/target/universal-apple-darwin/release/bundle/macos/Inkfin.app"
          DMG=$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)

          codesign --verify --deep --strict --verbose=2 "$APP"
          # The decision users actually meet when they launch the app.
          spctl --assess --type execute --verbose=4 "$APP"
          xcrun stapler validate "$APP"

          if [ -n "$DMG" ]; then
            codesign --verify --verbose=2 "$DMG"
            # Gatekeeper's own verdict on the image is recorded but not gated:
            # Tauri notarizes and staples the app inside the DMG, and the app
            # assessment above is the one that decides whether it launches.
            if spctl --assess --type open --context context:primary-signature --verbose=4 "$DMG"; then
              echo "::notice::Gatekeeper accepted the disk image."
            else
              echo "::warning::Gatekeeper did not accept the disk image itself; the app inside it passed and is stapled."
            fi
          fi

      # The download name is the one place a user sees what they are getting.
      - name: Name the download after its real distribution status
        run: |
          set -euo pipefail
          DMG=$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)
          case "${DISTRIBUTION}" in
            release) SUFFIX="" ;;
            signed-unnotarized) SUFFIX="-signed-unnotarized" ;;
            unsigned) SUFFIX="-unsigned" ;;
            *) echo "::error::unknown distribution label: ${DISTRIBUTION}"; exit 1 ;;
          esac
          echo "UNSIGNED_SUFFIX=${SUFFIX}" >> "$GITHUB_ENV"
          cp "$DMG" "$RUNNER_TEMP/Inkfin-${VERSION}-universal${SUFFIX}.dmg"
          ls -l "$RUNNER_TEMP"/*.dmg

          {
            echo ""
            echo "macOS DMG: \`Inkfin-${VERSION}-universal${SUFFIX}.dmg\`"
            if [ "${DISTRIBUTION}" != "release" ]; then
              echo ""
              echo "> **Not a notarised public release.** macOS will warn on first open."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the disk image as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: inkfin-macos-${{ needs.resolve.outputs.distribution }}
          path: ${{ runner.temp }}/Inkfin-*-universal*.dmg
          if-no-files-found: error
          retention-days: 14

  # Runs only when both installers exist, so a release never appears half-built.
  publish:
    needs: [resolve, build-windows, build-macos]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.resolve.outputs.tag }}
      VERSION: ${{ needs.resolve.outputs.version }}
      SHA: ${{ needs.resolve.outputs.sha }}
      DISTRIBUTION: ${{ needs.resolve.outputs.distribution }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Collect the installers
        uses: actions/download-artifact@v4
        with:
          pattern: inkfin-*
          path: dist
          merge-multiple: true

      - name: Publish or update the GitHub release
        run: |
          set -euo pipefail
          EXE=$(find dist -maxdepth 1 -name '*-setup.exe' -print -quit)
          DMG=$(find dist -maxdepth 1 -name '*.dmg' -print -quit)
          test -n "$EXE" || { echo "::error::the Windows installer is missing from the downloadable artifacts"; exit 1; }
          test -n "$DMG" || { echo "::error::the macOS disk image is missing from the downloadable artifacts"; exit 1; }
          ls -l dist

          WINDOWS_LINE="**Windows** — \`$(basename "$EXE")\` for 64-bit Windows 10 and 11. The installer includes the WebView2 bootstrapper."
          MACOS_LINE="**macOS** — \`$(basename "$DMG")\` is a universal build for Apple silicon and Intel. Double-click the disk image and drag Inkfin to Applications."
          if [ "${DISTRIBUTION}" = "release" ]; then
            MACOS_LINE="${MACOS_LINE} It is signed, notarised and stapled."
          else
            MACOS_LINE="${MACOS_LINE} **This build is not notarised.** macOS blocks the first launch: open System Settings → Privacy & Security and choose \`Open Anyway\`, or run \`xattr -dr com.apple.quarantine /Applications/Inkfin.app\`."
          fi

          # One replaceable block, so re-running a release never duplicates the
          # macOS note or leaves a stale one behind after the signing state
          # changes.
          BLOCK=$(printf '%s\n' "<!-- inkfin-macos -->" "$MACOS_LINE" "<!-- /inkfin-macos -->")

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; replacing its assets."
            gh release upload "$TAG" "$EXE" "$DMG" --clobber

            KEPT=$(gh release view "$TAG" --json body --jq '.body // ""' \
              | sed '/<!-- inkfin-macos -->/,/<!-- \/inkfin-macos -->/d')
            if [ -n "$KEPT" ]; then
              BODY=$(printf '%s\n\n%s\n' "$KEPT" "$BLOCK")
            else
              BODY=$(printf '%s\n' "$BLOCK")
            fi
            # The previous release body is kept; only the macOS block is renewed.
            gh release edit "$TAG" --notes "$BODY"
          else
            echo "Creating release $TAG at $SHA."
            BODY=$(printf '%s\n' \
              "$WINDOWS_LINE" \
              "" \
              "$BLOCK" \
              "" \
              "Inkfin is read-only: it never modifies your Markdown files and makes no network requests.")
            gh release create "$TAG" "$EXE" "$DMG" \
              --target "$SHA" \
              --title "Inkfin $VERSION" \
              --notes "$BODY"
          fi

          gh release view "$TAG" --json url,assets \
            --jq '"Release: \(.url)", (.assets[] | "  \(.name) (\(.size) bytes)")' \
            || echo "::warning::could not read the release back; check the Releases page manually"
