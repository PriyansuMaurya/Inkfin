name: Prepare Inkfin Store publication
on:
  push:
    branches: [publish/microsoft-store]
    paths: [.github/workflows/prepare-inkfin-store.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - name: Apply reviewed publishing preparation
        env:
          PATCH_B64: 
        run: |
          python - <<'PYCODE'
          import os,base64,gzip,subprocess
          from pathlib import Path
          from PIL import Image
          patch=Path(os.environ['RUNNER_TEMP'])/'inkfin-store.patch'
          patch.write_bytes(gzip.decompress(base64.b64decode(os.environ['PATCH_B64'])))
          subprocess.run(['git','apply','--check',str(patch)],check=True)
          subprocess.run(['git','apply',str(patch)],check=True)
          dest=Path('packaging/store/assets');dest.mkdir(parents=True,exist_ok=True)
          src=Image.open('tools/assets/inkfin-icon.png').convert('RGBA')
          for name,size in [('StoreLogo',50),('Square44x44Logo',44),('Square150x150Logo',150)]:
              src.resize((size,size),Image.Resampling.LANCZOS).save(dest/(name+'.png'))
          dest=Path('packaging/store/listing-assets');dest.mkdir(exist_ok=True)
          src.resize((300,300),Image.Resampling.LANCZOS).save(dest/'store-icon-300.png')
          Image.open('src-tauri/icons/128x128.png').save('website/public/icon.png')
          PYCODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/prepare-inkfin-store.yml
          git add .
          git commit -m 'Prepare MSIX packaging and Cloudflare Store support pages'
          git push origin HEAD:publish/microsoft-store
