[package]
name = "inkfin"
version = "0.1.1"
description = "Local Markdown file viewer with live preview"
authors = ["Markdown Preview"]
edition = "2021"
rust-version = "1.82"

[lib]
name = "markdown_preview_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
thiserror = "2"
sha2 = "0.10"
base64 = "0.22"
dunce = "1"
open = "5"
url = "2"
percent-encoding = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
